# Render Blueprint: one Postgres database + one Docker web service, wired together.
# In the Render dashboard: New > Blueprint > pick this repo. Only the API runs on Render;
# the React frontend is a static build deployed to DreamHost (client/scripts/deploy.sh).
databases:
  - name: circuit-trainer-db
    plan: free
    region: oregon
    databaseName: circuit_trainer
    user: circuit_trainer

services:
  - type: web
    name: circuit-trainer-api
    runtime: docker
    plan: free
    region: oregon
    # Monorepo: build from server/, and only redeploy when something in it changes.
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Render hands over the parts; application.properties assembles the JDBC URL.
      - key: DB_HOST
        fromDatabase: { name: circuit-trainer-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: circuit-trainer-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: circuit-trainer-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: circuit-trainer-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: circuit-trainer-db, property: password }
      # Random 256-bit value generated by Render: never in Git, never typed by a human.
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      # The frontend's origin, e.g. https://trainer.example.com. Asked for when the blueprint
      # is applied (sync: false keeps the value out of this file).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
