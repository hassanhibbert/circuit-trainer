databases:
  - name: circuit-trainer-db
    plan: free
    region: oregon
    databaseName: circuit_trainer
    user: circuit_trainer

services:
  - type: web
    name: circuit-trainer-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: circuit-trainer-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: circuit-trainer-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: circuit-trainer-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: circuit-trainer-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: circuit-trainer-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      # the frontend url, entered when applying the blueprint
      - key: CORS_ALLOWED_ORIGINS
        sync: false
