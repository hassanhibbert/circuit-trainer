spring.application.name=circuit-trainer
server.port=${PORT:8080}

# --- Database -----------------------------------------------------------------------
# DB_URL wins if set; otherwise the URL is assembled from parts (what Render provides).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:circuit_trainer}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Small pool on purpose: free/managed Postgres tiers allow few connections, and
# pool_size x app_instances must stay below the database's max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# --- JPA / schema -------------------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that entities and tables agree, and fails fast at startup if they don't.
spring.jpa.hibernate.ddl-auto=validate
# Close the Hibernate session when the transaction ends, not when the HTTP response
# is written. Lazy loading outside a service method then fails loudly instead of
# silently firing extra queries from the controller or the JSON serializer.
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
# When lazy collections are touched (a workout's sections, a session's sets), load them
# for up to 50 parents in one "... where parent_id in (?, ?, ...)" query instead of one
# query per parent. Turns N+1 into 1+1 without the paging problems of fetch joins.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Caps ?size= so a client can't ask for a million rows in one page.
spring.data.web.pageable.max-page-size=100

# --- Operations ---------------------------------------------------------------------
# Only /actuator/health is exposed (Render's health check). Details stay hidden from
# anonymous callers, since they would reveal the database type and disk usage.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Security -----------------------------------------------------------------------
# No default on purpose: a fallback secret committed to Git is a secret anyone can read.
# Locally it lives in application-local.properties (gitignored); in prod, an env var.
app.jwt.secret=${JWT_SECRET:}
# 12 hours: long enough that a token never expires in the middle of a workout, short
# enough to limit what a stolen token is worth. (Stateless JWTs can't be revoked early.)
app.jwt.ttl=${JWT_TTL:PT12H}
app.jwt.issuer=circuit-trainer
# Browser origins allowed to call the API. Comma-separated; the Vite dev server by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
