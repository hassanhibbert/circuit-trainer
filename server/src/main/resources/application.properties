spring.application.name=circuit-trainer
server.port=${PORT:8080}
# trust X-Forwarded-For from render's proxy so rate limits see the real client ip
server.forward-headers-strategy=native

# local dev values (gitignored), real env vars take priority
spring.config.import=optional:file:.env.server.local[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=${JWT_TTL:PT15M}
app.jwt.issuer=circuit-trainer
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.auth.refresh-ttl=${REFRESH_TTL:P30D}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.rate-limit.login-per-ip-per-minute=20
app.auth.rate-limit.login-per-username-per15-minutes=10
app.auth.rate-limit.register-per-ip-per-hour=5
app.auth.rate-limit.demo-per-ip-per-hour=30
