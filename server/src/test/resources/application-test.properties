app.jwt.secret=test-only-secret-not-used-anywhere-else-0123456789

# only used with TEST_DB_URL, testcontainers overrides these
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/circuit_trainer_test}
spring.datasource.username=${TEST_DB_USERNAME:${user.name}}
spring.datasource.password=${TEST_DB_PASSWORD:}

# every test request comes from 127.0.0.1, so the real limits would trip across tests
app.auth.rate-limit.login-per-ip-per-minute=1000
app.auth.rate-limit.register-per-ip-per-hour=1000
