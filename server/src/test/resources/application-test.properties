# Loaded only by tests annotated @ActiveProfiles("test"), *on top of* the main
# application.properties. (A file named plain application.properties here would
# replace the main one entirely: a classic source of confusing test failures.)
app.jwt.secret=test-only-secret-not-used-anywhere-else-0123456789

# Used only when TEST_DB_URL is set (see TestDatabase). With Docker, the Testcontainers
# @ServiceConnection takes precedence over these properties.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/circuit_trainer_test}
